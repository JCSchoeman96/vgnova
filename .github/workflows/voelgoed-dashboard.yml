name: Voelgoed dashboard checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  dashboard:
    name: Dashboard checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: none

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install --yes ripgrep

      - name: Run dashboard checks
        working-directory: voelgoed-platform-core
        run: ./bin/check.sh

      - name: Check pull request patch whitespace
        if: ${{ github.event_name == 'pull_request' }}
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"

      - name: Check push patch whitespace
        if: ${{ github.event_name == 'push' }}
        run: git diff --check "${{ github.event.before }}...${{ github.sha }}"

  source:
    name: Canonical source checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: none

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck

      - name: Run canonical source checks
        run: ./site-code/bin/check-source.sh

  platform_gate:
    name: VG Nova Platform Gate
    needs: [dashboard, source]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require both checks to succeed
        env:
          DASHBOARD_RESULT: ${{ needs.dashboard.result }}
          SOURCE_RESULT: ${{ needs.source.result }}
        run: |
          printf 'dashboard=%s\nsource=%s\n' "$DASHBOARD_RESULT" "$SOURCE_RESULT"
          [[ "$DASHBOARD_RESULT" == success && "$SOURCE_RESULT" == success ]]
