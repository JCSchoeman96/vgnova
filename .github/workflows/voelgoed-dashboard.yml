name: Voelgoed dashboard checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  dashboard:
    name: Dashboard checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: none

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install --yes ripgrep

      - name: Run dashboard checks
        working-directory: voelgoed-platform-core
        run: ./bin/check.sh

      - name: Check event patch whitespace
        if: ${{ always() }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            git diff --check "$PR_BASE_SHA...$PR_HEAD_SHA"
          elif [[ "$EVENT_NAME" == push ]]; then
            git diff --check "$PUSH_BEFORE_SHA...$EVENT_SHA"
          else
            printf 'Unsupported event: %s\n' "$EVENT_NAME" >&2
            exit 1
          fi

  source:
    name: Canonical source checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up canonical Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'
          check-latest: false

      - name: Record canonical archive toolchain
        run: |
          python3 - <<'PY'
          import hashlib
          import platform
          import tarfile
          import zlib
          from pathlib import Path

          print(f"python_implementation={platform.python_implementation()}")
          print(f"python_version={platform.python_version()}")
          print(f"tarfile_module_sha256={hashlib.sha256(Path(tarfile.__file__).read_bytes()).hexdigest()}")
          print(f"zlib_build_version={zlib.ZLIB_VERSION}")
          print(f"zlib_runtime_version={zlib.ZLIB_RUNTIME_VERSION}")
          print(f"platform={platform.platform()}")
          PY

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: none

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck

      - name: Run canonical source checks
        run: ./site-code/bin/check-source.sh

      - name: Build canonical Platform Core artifact
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: python3 site-code/bin/build-platform-core.py --ref "${GITHUB_SHA}" --output dist

  platform_gate:
    name: VG Nova Platform Gate
    needs: [dashboard, source]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require both checks to succeed
        env:
          DASHBOARD_RESULT: ${{ needs.dashboard.result }}
          SOURCE_RESULT: ${{ needs.source.result }}
        run: |
          printf 'dashboard=%s\nsource=%s\n' "$DASHBOARD_RESULT" "$SOURCE_RESULT"
          [[ "$DASHBOARD_RESULT" == success && "$SOURCE_RESULT" == success ]]

  publish_platform_core:
    name: Publish Platform Core artifact
    needs: [platform_gate]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.platform_gate.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up canonical Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.4'
          check-latest: false

      - name: Record canonical archive toolchain
        run: |
          python3 - <<'PY'
          import hashlib
          import platform
          import tarfile
          import zlib
          from pathlib import Path

          print(f"python_implementation={platform.python_implementation()}")
          print(f"python_version={platform.python_version()}")
          print(f"tarfile_module_sha256={hashlib.sha256(Path(tarfile.__file__).read_bytes()).hexdigest()}")
          print(f"zlib_build_version={zlib.ZLIB_VERSION}")
          print(f"zlib_runtime_version={zlib.ZLIB_RUNTIME_VERSION}")
          print(f"platform={platform.platform()}")
          PY

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: none

      - name: Build canonical Platform Core artifact
        run: python3 site-code/bin/build-platform-core.py --ref "${GITHUB_SHA}" --output dist

      - name: Verify exact upload directory
        run: python3 site-code/bin/check-platform-core-build.py --ref "${GITHUB_SHA}" --verify-output dist

      - name: Upload canonical Platform Core artifact
        uses: actions/upload-artifact@v4
        with:
          name: voelgoed-platform-core-${{ github.sha }}
          path: |
            dist/voelgoed-platform-core.tar.gz
            dist/voelgoed-platform-core.manifest.json
          if-no-files-found: error
          compression-level: 0
